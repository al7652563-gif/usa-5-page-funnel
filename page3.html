<script>
  const ctaBtn = document.getElementById('ctaBtn');
  const lockNote = document.getElementById('lockNote');
  const video = document.getElementById('mainVideo');

  // Mute / unmute toggle
  const mutePill = document.getElementById('mutePill');
  const muteIcon = document.getElementById('muteIcon');
  const muteLabel = document.getElementById('muteLabel');
  mutePill.addEventListener('click', () => {
    video.muted = !video.muted;
    muteIcon.innerHTML = video.muted ? '&#128263;' : '&#128266;';
    muteLabel.textContent = video.muted ? 'Tap to unmute' : 'Tap to mute';
  });

  video.addEventListener('ended', () => {
    ctaBtn.disabled = false;
    ctaBtn.classList.add('unlock-anim');
    lockNote.style.display = 'none';
    ctaBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  ctaBtn.addEventListener('click', () => {
    window.location.href = '/page4';
  });
</script>
